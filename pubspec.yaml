name: magyc
description: Mini action-RPG isometrico construido con Flutter + Flame.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.30.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

# Dajarony Core se enlazara en Fase 3 del Playbook, despues de cerrar y validar
# Design System y App Shell. No se introduce un segundo sistema de DI.
