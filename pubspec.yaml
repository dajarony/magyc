name: magyc
description: Mini action-RPG isometrico construido con Flutter + Flame.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

# Flame 1.30.1 mantiene compatibilidad con Dart 3.7, que es la base actual
# documentada por Dajarony Nucleo Flutter. Podemos subirlo cuando actualicemos
# el toolchain de Flutter/Dart.
dependencies:
  flutter:
    sdk: flutter
  flame: ^1.30.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
